# ResInvest ERP 4 — Nginx: TLS, nagłówki bezpieczeństwa, limity żądań, frontend + reverse proxy do API.
# Certyfikat: firmowe CA albo Let's Encrypt (DNS) — pliki montowane w /etc/nginx/tls (poza repozytorium).

limit_req_zone $binary_remote_addr zone=riw_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=riw_auth:10m rate=10r/m;

upstream riw_api { server api:3000; keepalive 16; }

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:riw_tls:10m;
  ssl_session_tickets off;

  # Dostęp tylko z LAN i puli FortiClient VPN (uzupełnij adresami firmy; FortiGate filtruje wcześniej)
  # allow 10.0.0.0/8;
  # allow 10.212.134.0/24;
  # deny all;

  server_tokens off;
  client_max_body_size 20m;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

  # nagłówki bezpieczeństwa: w pliku dołączanym także w lokalizacjach z własnym add_header
  # (Nginx nie dziedziczy add_header z poziomu serwera, gdy lokalizacja ma choć jeden własny)
  include /etc/nginx/conf.d/riw-security.inc;

  root /usr/share/nginx/html;

  location = /api/v1/health { proxy_pass http://riw_api; include /etc/nginx/conf.d/riw-proxy.inc; }

  location /api/v1/auth/ {
    limit_req zone=riw_auth burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://riw_api;
    include /etc/nginx/conf.d/riw-proxy.inc;
  }

  location /api/ {
    limit_req zone=riw_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://riw_api;
    include /etc/nginx/conf.d/riw-proxy.inc;
  }

  # zasoby z hashem w nazwie — długi cache; index.html i service worker — bez cache (nowa wersja widoczna od razu)
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable" always; include /etc/nginx/conf.d/riw-security.inc; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-store" always; include /etc/nginx/conf.d/riw-security.inc; }
  location = /sw.js { add_header Cache-Control "no-cache" always; add_header Service-Worker-Allowed "/" always; include /etc/nginx/conf.d/riw-security.inc; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; include /etc/nginx/conf.d/riw-security.inc; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
