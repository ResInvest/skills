[package]
name = "resinvest-erp-desktop"
version = "4.0.0"
description = "ResInvest ERP — aplikacja Windows (okno natywne na serwer firmowy)"
authors = ["Roesner Mateusz"]
license-file = "../../../LICENSE"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "resinvest_erp_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
